{% extends "base.html" %}
{% block title %}Login or Sign up — {{ site.get('name','Free Online Shopping') }}{% endblock %}
{% block content %}
<h1>{{ 'login.title'|t }}</h1>
<p class="muted">{{ 'login.subtitle'|t }}</p>
<div class="authgrid">
  <div class="card auth {% if tab != 'signup' %}active{% endif %}" id="signin">
    <h2>{{ 'login.sign_in'|t }}</h2>
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <input name="username" placeholder="{{ 'login.username_email'|t }}" required autofocus>
      <input type="password" name="password" placeholder="{{ 'login.password'|t }}" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn">{{ 'login.sign_in_btn'|t }}</button>
    </form>
  </div>
  <div class="card auth {% if tab == 'signup' %}active{% endif %}" id="signup">
    <h2>{{ 'login.create_account'|t }}</h2>
    <form method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <input name="username" placeholder="{{ 'login.choose_username'|t }}" required {% if tab == 'signup' %}autofocus{% endif %}>
      <input type="email" name="email" placeholder="{{ 'login.email_optional'|t }}">
      <input type="password" name="password" placeholder="{{ 'login.password_placeholder'|t }}" required>
      <button class="btn">{{ 'login.sign_up_btn'|t }}</button>
    </form>
  </div>
</div>
{% endblock %}
