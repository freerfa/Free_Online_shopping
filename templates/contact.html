{% extends "base.html" %}{% block content %}<h1>Contact us</h1><p>{{ site.get('contact_email','') }} | {{ site.get('contact_phone','') }} | {{ site.get('address','') }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input name="name" placeholder="Name" required><input name="email" placeholder="Email" required><input name="subject" placeholder="Subject" value="{{ prefill or '' }}"><textarea name="message" placeholder="Message" required></textarea><button class="btn">Send</button></form>{% endblock %}
