{% extends "base.html" %}{% block content %}<h1>{{ 'contact.title'|t }}</h1><p>{{ site.get('contact_email','') }} | {{ site.get('contact_phone','') }} | {{ site.get('address','') }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input name="name" placeholder="{{ 'contact.name'|t }}" required><input name="email" placeholder="{{ 'contact.email'|t }}" required><input name="subject" placeholder="{{ 'contact.subject'|t }}" value="{{ prefill or '' }}"><textarea name="message" placeholder="{{ 'contact.message'|t }}" required></textarea><button class="btn">{{ 'contact.send'|t }}</button></form>{% endblock %}
