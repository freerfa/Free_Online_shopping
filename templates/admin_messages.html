{% extends "admin_base.html" %}
{% block admin %}
<h1>Messages ({{ msgs|length }})</h1>
{% for m in msgs %}
<div class="card msgrow">
  <b>{{ m["name"] }}</b> <span class="muted">&lt;{{ m["email"] }}&gt; · {{ (m["created"] or '')[:16] }}</span>
  <h3>{{ m["subject"] or '(no subject)' }}</h3>
  <p>{{ m["message"] }}</p>
  <div class="btnrow"><a class="btn small" href="mailto:{{ m['email'] }}">Reply</a>
  <form method="post" onsubmit="return confirm('Delete this message?')"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="mid" value="{{ m["id"] }}"><button class="btn small danger">Delete</button></form></div>
</div>
{% else %}<p class="muted">No messages yet.</p>{% endfor %}
{% endblock %}
